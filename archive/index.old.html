    * {

      animation-duration: 25s;
    }

    .orb2 {

      height: 400px;
      background: radial-gradient(circle, #00d4ff, transparent);
      bottom: -150px;
      right: -100px;
      animation-duration: 30s;
      animation-direction: reverse;
    }
