<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eris — Chatbot de IA</title>
  <meta name="description" content="Eris — Asistente conversacional local. Interfaz simple para chatear y configurar una API key (opcional).">
  <meta property="og:title" content="Eris — Chatbot de IA">
  <meta property="og:description" content="Eris — Asistente conversacional local. Interfaz simple para chatear y configurar una API key (opcional).">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app" role="application" aria-label="Eris chat">
    <header class="header">
      <h1>🌙 Eris</h1>
      <div class="header-actions">
        <button id="btnSettings" class="btn-ghost" aria-haspopup="dialog" title="Ajustes">⚙️</button>
        <button class="btn-danger" id="btnLimpiar">🗑️ Limpiar</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <div class="mensaje eris">
        Hola 👋 Soy Eris. ¿En qué puedo ayudarte hoy?
        <div class="timestamp">Ahora</div>
      </div>
    </main>

    <form id="formEntrada" class="entrada" aria-label="Enviar mensaje">
      <input id="mensaje" name="mensaje" placeholder="Escribe algo..." autocomplete="off" aria-label="Mensaje">
      <button id="btnEnviar" type="submit" class="btn-primary">Enviar</button>
    </form>

    <!-- Settings modal -->
    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Ajustes</h2>
      <form method="dialog" id="settingsForm">
        <fieldset>
          <legend>Método de uso de la API key</legend>
          <label><input type="radio" name="mode" value="proxy"> Usar proxy seguro (recomendado)</label>
          <label><input type="radio" name="mode" value="local"> Guardar API key en este navegador (localStorage)</label>
        </fieldset>

        <label for="apiKeyInput">API key (opcional)</label>
        <input id="apiKeyInput" name="apiKey" placeholder="sk-..." aria-label="API key">

        <p class="note">Nota: Guardar la clave en localStorage es conveniente pero puede exponerla si el sitio tiene vulnerabilidades XSS. Use el proxy en producción.</p>

        <menu>
          <button id="saveSettings" class="btn-primary">Guardar</button>
          <button id="closeSettings" class="btn-ghost">Cerrar</button>
        </menu>
      </form>
    </dialog>

  </div>

  <script src="assets/app.js" defer></script>
</body>
</html>
