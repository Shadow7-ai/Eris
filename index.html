<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eris - IA Personal Inteligente</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="eris-interface">
            <!-- Avatar y Estado -->
            <div class="avatar-section">
                <div class="avatar-container">
                    <div class="avatar" id="avatar">
                        <div class="eyes">
                            <div class="eye left"><div class="pupil"></div></div>
                            <div class="eye right"><div class="pupil"></div></div>
                        </div>
                        <div class="mouth" id="mouth"></div>
                    </div>
                    <div class="status-indicator" id="status"></div>
                </div>
                <h1 id="eris-name">Eris</h1>
                <p id="eris-mood" class="mood">Esperando...</p>
            </div>

            <!-- Panel de Chat -->
            <div class="chat-panel">
                <div class="chat-header">
                    <h2>Conversación</h2>
                    <div class="controls">
                        <button id="voice-toggle" class="control-btn" title="Activar/Desactivar voz">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button id="clear-chat" class="control-btn" title="Limpiar chat">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="input-area">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="Escribe algo o habla con Eris..."
                        autocomplete="off"
                    >
                    <button id="send-btn" class="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                    <button id="mic-btn" class="mic-button">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>
            </div>

            <!-- Panel de Personalidad -->
            <div class="personality-panel">
                <h3>Personalidad</h3>
                <div class="personality-traits" id="personality-traits">
                    <div class="trait">
                        <label>Energía:</label>
                        <div class="trait-bar" id="energy-bar"></div>
                    </div>
                    <div class="trait">
                        <label>Humor:</label>
                        <div class="trait-bar" id="mood-bar"></div>
                    </div>
                    <div class="trait">
                        <label>Curiosidad:</label>
                        <div class="trait-bar" id="curiosity-bar"></div>
                    </div>
                    <div class="trait">
                        <label>Empatía:</label>
                        <div class="trait-bar"></div>
                    </div>
                </div>
                <div class="stats">
                    <p id="interaction-count">Interacciones: 0</p>
                    <p id="learning-status">Estado: Aprendiendo</p>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="eris.js"></script>
    <script src="voice.js"></script>
    <script src="personality.js"></script>
</body>
</html>
